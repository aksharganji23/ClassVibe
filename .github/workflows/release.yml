# Builds a signed release APK when you push a version tag (e.g. v1.1.0 or v1.2.0-beta.1)
# and publishes it as a GitHub Release with a SHA-256 checksum file.
# The in-app updater downloads these releases and verifies the checksum + signature.
name: Release

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Check signing secrets exist
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::error::Missing KEYSTORE_BASE64 secret. See GUIDE.md → Part D."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release-keystore.jks

      - name: Build signed release APK
        env:
          CLASSVIBE_KEYSTORE_FILE: release-keystore.jks
          CLASSVIBE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          CLASSVIBE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          CLASSVIBE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gradle assembleRelease --stacktrace \
            -Pclassvibe.version="$VERSION" \
            -Pclassvibe.githubRepo="${{ github.repository }}"

      - name: Rename APK and create checksum
        run: |
          mkdir -p dist
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          cp "$APK" "dist/ClassVibe-${GITHUB_REF_NAME}.apk"
          # Stable name so .../releases/latest/download/ClassVibe.apk always gives the newest version.
          cp "$APK" "dist/ClassVibe.apk"
          cd dist
          sha256sum "ClassVibe-${GITHUB_REF_NAME}.apk" > "ClassVibe-${GITHUB_REF_NAME}.apk.sha256"
          cat "ClassVibe-${GITHUB_REF_NAME}.apk.sha256"

      - name: Extract release notes from CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[?v?"v"\\]?" {found=1; next}
            found && /^## / {exit}
            found {print}
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then echo "See CHANGELOG.md" > release_notes.md; fi
          cat release_notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: release_notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/ClassVibe-${{ github.ref_name }}.apk
            dist/ClassVibe-${{ github.ref_name }}.apk.sha256
            dist/ClassVibe.apk

      - name: Remove keystore
        if: always()
        run: rm -f release-keystore.jks
